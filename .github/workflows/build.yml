name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Sign every build with the same key so new versions install over old ones.
      # Add a repository secret SIGNING_KEYSTORE_B64 (base64 of a keystore with password "android",
      # alias "androiddebugkey") to keep it stable; without it a fresh debug key is used.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk P3-Companion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: P3-Companion
          path: P3-Companion.apk

      # A fixed download page: Releases > "Latest build" > P3-Companion.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest build" --notes "Tap P3-Companion.apk below to download and install." --prerelease
          gh release upload latest P3-Companion.apk --clobber
